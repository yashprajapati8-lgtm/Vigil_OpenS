[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-instrument"
version = "0.1.0"
description = "Report what VIGIL needs from a FastAPI app: requests, calls to other services, the customer action."
license = "MIT"
requires-python = ">=3.9"
dependencies = ["prometheus-client>=0.20"]

[project.optional-dependencies]
test = ["pytest", "fastapi", "httpx", "requests"]

[tool.setuptools]
packages = ["vigil_instrument"]
